<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>not here</title>
<meta name="robots" content="noindex, follow">
<link rel="icon" href="data:image/svg+xml;utf8,&lt;svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'&gt;&lt;rect width='16' height='16' fill='%23f6f4ef'/&gt;&lt;/svg&gt;">
<style>
:root{--paper:#f6f4ef;--ink:#111;--dim:#6b6b66;--hi:#e8e5dc;--measure:33em;--indent:17%;
--sans:"Helvetica Neue",Helvetica,Inter,"Segoe UI",Arial,sans-serif}
*{box-sizing:border-box}
html,body{background:var(--paper);margin:0;padding:0}
body{font-family:var(--sans);color:var(--ink);font-size:17px;line-height:1.06;letter-spacing:-.012em;
-webkit-font-smoothing:antialiased}
.m{margin:92px 0 0 var(--indent);max-width:var(--measure);padding:0 26px 120px}
p{margin:0 0 17px}
.k{text-transform:uppercase;color:var(--dim)}
a{color:inherit;text-decoration:none;text-underline-offset:2px}
a:hover{background:var(--hi)}
@media (max-width:820px){:root{--indent:0%}.m{margin-top:56px}}
</style>
</head>
<body>
<div class="m">
<p class="k">404</p>
<p id="line">Nothing at this address.</p>
<p><a href="/">&mdash; index</a></p>
</div>
<script>
/* The CV used to live at /FangyanuoZhou/ and /fangyanuo-zhou/ before the repo was
   renamed to `cv`. GitHub Pages cannot issue a 301 for a path that no longer exists,
   so unknown paths land here and get forwarded. Match is case-insensitive on purpose:
   the filesystem behind Pages is not. */
(function () {
  var m = location.pathname.match(/^\/fangyanuo[-_]?zhou\/?(.*)$/i);
  if (!m) return;
  var rest = m[1].replace(/^cv\//i, "");
  document.getElementById("line").textContent = "The CV moved. Forwarding\u2026";
  location.replace("https://noahisarider.github.io/cv/" + rest);
})();
</script>
</body>
</html>
